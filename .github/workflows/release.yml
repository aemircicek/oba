name: Release

# Publishing a GitHub release builds Oba for each OS with jpackage (Java included):
#   Windows: installer (.exe, per-user, shortcuts, .scbackup association) and a portable .zip
#   macOS:   .dmg
#   Linux:   .deb
# plus the runnable jar per OS (JavaFX ships native libraries). Every file gets a signed
# build-provenance attestation (Sigstore), and a SHA256SUMS file is added at the end.
on:
  release:
    types: [published]
  workflow_dispatch:          # rebuild the packages of an existing release
    inputs:
      tag:
        description: Release tag to package (for example v3.2.0)
        required: true

permissions:
  contents: write      # upload release assets
  packages: write      # push the server image to ghcr.io
  id-token: write      # sign attestations with the workflow's identity
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}   # build exactly the released code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Tools for the Windows installer (WiX 3)
        if: runner.os == 'Windows'
        # GitHub's Windows images usually ship WiX 3 already; install it only when missing.
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3*") { "WiX 3 is already installed" }
          else { choco install wixtoolset -y --no-progress }
      - name: Tools for .deb packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: macOS icon, microphone and camera permission
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          iconutil -c icns packaging/macos/oba.iconset -o packaging/macos/oba.icns
          # Calls need the microphone and the camera, and macOS only asks the user if Info.plist says why
          # (without a reason it refuses the camera, or ends the app).
          # Start from this JDK's own Info.plist template (its placeholders differ between versions).
          jimage extract --dir jdk-res --include 'regex:.*/Info-lite\.plist\.template' "$JAVA_HOME/lib/modules"
          TEMPLATE=$(find jdk-res -name 'Info-lite.plist.template' | head -n 1)
          if [ -z "$TEMPLATE" ]; then
            echo "::warning::Info.plist template not found; the app will not be able to ask for the microphone"
            exit 0
          fi
          mkdir -p packaging/macos/resources
          perl -pe 's#^\s*</dict>#  <key>NSMicrophoneUsageDescription</key>\n  <string>Oba uses the microphone only during end-to-end encrypted voice calls, voice rooms and voice messages.</string>\n  <key>NSCameraUsageDescription</key>\n  <string>Oba uses the camera only when you turn it on in an end-to-end encrypted video call.</string>\n</dict>#' \
            "$TEMPLATE" > packaging/macos/resources/Info.plist
          grep -q NSMicrophoneUsageDescription packaging/macos/resources/Info.plist
          grep -q NSCameraUsageDescription packaging/macos/resources/Info.plist
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: bash packaging/package.sh "${TAG#v}" "$PLATFORM"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/* --clobber

  server-image:
    # The server as a ready-made image (amd64 and arm64), for deploy/oba-server.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          TAGS="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oba-server:$V"
          # pre-releases never become "latest"
          if [ "$PRERELEASE" != "true" ] && [[ "$V" != *-* ]]; then TAGS="$TAGS,ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oba-server:latest"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: OBA_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/oba-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  checksums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" -R "${{ github.repository }}" --pattern 'Oba-*'
          sha256sum Oba-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "${{ github.repository }}" --clobber
      - name: Sign SHA256SUMS for the app's own updater
        # The app installs an update only if SHA256SUMS carries a signature by this key (its public
        # half is built into the app, see ui/Updater.java) and the download matches its line.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SIGNING_KEY: ${{ secrets.OBA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::OBA_RELEASE_SIGNING_KEY is not set: apps will offer this release as a download, not install it"
            exit 0
          fi
          cd assets
          umask 077
          printf '%s\n' "$SIGNING_KEY" > key.pem
          openssl pkeyutl -sign -inkey key.pem -rawin -in SHA256SUMS -out sig.bin
          openssl pkey -in key.pem -pubout > pub.pem
          rm -f key.pem
          base64 -w0 sig.bin > SHA256SUMS.sig
          openssl pkeyutl -verify -pubin -inkey pub.pem -rawin -in SHA256SUMS -sigfile sig.bin
          gh release upload "$TAG" SHA256SUMS.sig -R "${{ github.repository }}" --clobber
