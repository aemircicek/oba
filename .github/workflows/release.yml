name: Release

# Publishing a GitHub release builds Oba for each OS with jpackage (Java included):
#   Windows: installer (.exe, per-user, shortcuts, .scbackup association) and a portable .zip
#   macOS:   .dmg
#   Linux:   .deb
# plus the runnable jar per OS (JavaFX ships native libraries). Every file gets a signed
# build-provenance attestation (Sigstore), and a SHA256SUMS file is added at the end.
on:
  release:
    types: [published]
  workflow_dispatch:          # rebuild the packages of an existing release
    inputs:
      tag:
        description: Release tag to package (for example v3.2.0)
        required: true

permissions:
  contents: write      # upload release assets
  id-token: write      # sign attestations with the workflow's identity
  attestations: write

env:
  WIN_UPGRADE_UUID: 3b9f6c1e-6a52-4f0e-9a51-6c0f2c7e5a11   # never change: lets new versions replace old ones

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}   # build exactly the released code
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Tools for the Windows installer (WiX 3)
        if: runner.os == 'Windows'
        # GitHub's Windows images usually ship WiX 3 already; install it only when missing.
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3*") { "WiX 3 is already installed" }
          else { choco install wixtoolset -y --no-progress }
      - name: Tools for .deb packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: macOS icon and microphone permission
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          iconutil -c icns packaging/macos/oba.iconset -o packaging/macos/oba.icns
          # Voice calls need the microphone, and macOS only asks the user if Info.plist says why.
          # Start from this JDK's own Info.plist template (its placeholders differ between versions).
          jimage extract --dir jdk-res --include 'regex:.*/Info-lite\.plist\.template' "$JAVA_HOME/lib/modules"
          TEMPLATE=$(find jdk-res -name 'Info-lite.plist.template' | head -n 1)
          if [ -z "$TEMPLATE" ]; then
            echo "::warning::Info.plist template not found; the app will not be able to ask for the microphone"
            exit 0
          fi
          mkdir -p packaging/macos/resources
          perl -pe 's#^\s*</dict>#  <key>NSMicrophoneUsageDescription</key>\n  <string>Oba uses the microphone only during end-to-end encrypted voice calls, voice rooms and voice messages.</string>\n</dict>#' \
            "$TEMPLATE" > packaging/macos/resources/Info.plist
          grep -q NSMicrophoneUsageDescription packaging/macos/resources/Info.plist
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"               # file names keep a suffix such as -rc.1; installers need plain numbers
          mkdir -p dist input
          cp target/secure-chat.jar input/
          cp target/secure-chat.jar "dist/Oba-${VERSION}-${PLATFORM}.jar"
          COMMON=(--name Oba --input input --main-jar secure-chat.jar --main-class com.emirchat.Main
                  --app-version "${VERSION%%-*}" --vendor "Emir Cicek" --copyright "(c) 2026 Emir Cicek, MIT License"
                  --description "End-to-end encrypted messenger")
          INSTALLER=(--about-url "https://github.com/aemircicek/secure-chat")   # not valid for app-image
          # Faster starts (AppCDS): the JVM writes a class archive next to the app on the first run and
          # maps it on later ones. Only where the app folder belongs to the user (Windows per-user
          # install and the portable zip); a macOS bundle must not change after signing and /opt is
          # read-only. ($APPDIR is expanded by jpackage's launcher, not by this shell.)
          CDS=(--java-options '-XX:+AutoCreateSharedArchive' --java-options '-XX:SharedArchiveFile=$APPDIR/oba.jsa')
          case "$RUNNER_OS" in
            Windows)
              jpackage "${COMMON[@]}" "${CDS[@]}" "${INSTALLER[@]}" --type exe --icon packaging/windows/oba.ico --dest pkg \
                --win-per-user-install --win-menu --win-menu-group Oba --win-shortcut --win-shortcut-prompt \
                --win-dir-chooser --win-upgrade-uuid "$WIN_UPGRADE_UUID" --file-associations packaging/scbackup.properties
              cp pkg/*.exe "dist/Oba-${VERSION}-${PLATFORM}.exe"
              jpackage "${COMMON[@]}" "${CDS[@]}" --type app-image --icon packaging/windows/oba.ico --dest portable
              ZIP="dist/Oba-${VERSION}-${PLATFORM}-portable.zip"
              if command -v 7z > /dev/null; then (cd portable && 7z a -tzip "../$ZIP" Oba > /dev/null)
              else powershell -NoProfile -Command "Compress-Archive -Path portable/Oba -DestinationPath '$ZIP'"; fi ;;
            macOS)
              RES=()
              if [ -f packaging/macos/resources/Info.plist ]; then RES=(--resource-dir packaging/macos/resources); fi
              jpackage "${COMMON[@]}" "${INSTALLER[@]}" ${RES[@]+"${RES[@]}"} --type dmg --icon packaging/macos/oba.icns --dest pkg \
                --mac-package-identifier org.oba.app --mac-package-name Oba \
                --file-associations packaging/scbackup.properties
              cp pkg/*.dmg "dist/Oba-${VERSION}-${PLATFORM}.dmg" ;;
            Linux)
              jpackage "${COMMON[@]}" "${INSTALLER[@]}" --type deb --icon packaging/linux/oba.png --dest pkg \
                --linux-package-name oba --linux-shortcut --linux-menu-group Network --linux-app-category net \
                --file-associations packaging/scbackup.properties
              cp pkg/*.deb "dist/Oba-${VERSION}-${PLATFORM}.deb" ;;
          esac
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/* --clobber

  checksums:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets && cd assets
          gh release download "$TAG" -R "${{ github.repository }}" --pattern 'Oba-*'
          sha256sum Oba-* > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "${{ github.repository }}" --clobber
