name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify

  # The whole suite on Windows and macOS too, then the real capture paths (FFmpeg's native
  # libraries, the screen, and the camera where there is one) on all three systems.
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        if: runner.os != 'Linux'   # the build job above already runs them on Linux
        run: mvn -B verify
      - name: A fake camera (v4l2loopback fed by FFmpeg)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y v4l2loopback-dkms v4l-utils ffmpeg xvfb "linux-modules-extra-$(uname -r)" || sudo apt-get install -y v4l2loopback-dkms v4l-utils ffmpeg xvfb
          sudo modprobe v4l2loopback devices=1 video_nr=0 card_label=OBA exclusive_caps=1
          sudo chmod 666 /dev/video0
          nohup ffmpeg -loglevel warning -re -f lavfi -i testsrc=size=640x480:rate=30 -pix_fmt yuyv422 -f v4l2 /dev/video0 > feeder.log 2>&1 &
          sleep 4
          cat feeder.log
          v4l2-ctl -d /dev/video0 --all | head -40 || true
          # the system's own FFmpeg reads a frame: if this fails the camera is the runner's problem, not Oba's
          if ffmpeg -loglevel error -f v4l2 -i /dev/video0 -frames:v 1 -y probe.png; then
            echo "OBA_EXPECT_CAMERA=1" >> "$GITHUB_ENV"
          else
            echo "::warning::the virtual camera cannot be read even by the system FFmpeg; the camera check only expects a clean report"
          fi
      # The installers, built as a release would build them (nothing is uploaded), so packaging
      # and the start-up archive (AppCDS) are checked on every change.
      - name: Tools for the Windows installer (WiX 3)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3*") { "WiX 3 is already installed" }
          else { choco install wixtoolset -y --no-progress }
      - name: Tools for .deb packages
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fakeroot
      - name: macOS icon
        if: runner.os == 'macOS'
        run: iconutil -c icns packaging/macos/oba.iconset -o packaging/macos/oba.icns
      - name: Package (check only)
        shell: bash
        run: |
          [ -f target/secure-chat.jar ] || mvn -B -q package -DskipTests
          bash packaging/package.sh 1.0.0-ci "$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')-check"
          if [ "$RUNNER_OS" != Windows ]; then
            find img -name oba.jsa | grep -q . || { echo "::error::no AppCDS archive in the package"; cat cds-train.log; exit 1; }
          fi
      - name: Real capture paths
        shell: bash
        run: |
          RUN=(mvn -B test -Dtest=NativeCaptureTest -Doba.native=true -Dsurefire.failIfNoSpecifiedTests=false)
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${RUN[@]}"; else "${RUN[@]}"; fi

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.183.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep security scan
        run: semgrep scan --metrics=off --error --config p/java --config p/secrets --config p/security-audit --config p/owasp-top-ten src/main
